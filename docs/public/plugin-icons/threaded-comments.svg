<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="评论区树状显示">
  <rect width="64" height="64" rx="15" fill="#0f172a"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#7cc6ff" stroke-opacity=".22" stroke-width="2"/>

  <!-- 主干与分支：父节点在左，两个子回复缩进一级 -->
  <g stroke="#7cc6ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M15 21v25"/>
    <path d="M15 32h5.5"/>
    <path d="M15 46h5.5"/>
  </g>

  <g fill="#7cc6ff">
    <circle cx="15" cy="18" r="3.4"/>
    <circle cx="24" cy="32" r="3"/>
    <circle cx="24" cy="46" r="3"/>
  </g>

  <!-- 正文条：同一层等宽，读起来像三条回复 -->
  <g fill="#e8eefc">
    <rect x="21.5" y="16.6" width="24" height="2.8" rx="1.4" opacity=".95"/>
    <rect x="30.5" y="30.6" width="19" height="2.8" rx="1.4" opacity=".7"/>
    <rect x="30.5" y="44.6" width="15" height="2.8" rx="1.4" opacity=".7"/>
  </g>
</svg>
