<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" role="img" aria-label="Echo Smartisan">
  <defs>
    <!-- 纸面本色：极浅的纵向明度差，就是锤子设置页那张纸 -->
    <linearGradient id="s-paper" x1="0" y1="0" x2="0" y2="48">
      <stop offset="0" stop-color="#f8f8f8"/>
      <stop offset="0.6" stop-color="#f2f2f2"/>
      <stop offset="1" stop-color="#eaeaea"/>
    </linearGradient>

    <!-- 竖条纹：真机约 3.6dp 周期的纸纹 -->
    <pattern id="s-stripe" width="2.4" height="2.4" patternUnits="userSpaceOnUse">
      <rect width="1.2" height="2.4" fill="#000000" fill-opacity="0.022"/>
    </pattern>

    <!-- 底部装饰条：锤子主蓝渐变 -->
    <linearGradient id="s-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b87eb"/>
      <stop offset="1" stop-color="#5883eb"/>
    </linearGradient>

    <clipPath id="s-box">
      <path d="M20 0L28 0C41 0,48 7,48 20L48 28C48 41,41 48,28 48L20 48C7 48,0 41,0 28L0 20C0 7,7 0,20 0Z"/>
    </clipPath>
  </defs>

  <!-- 与另外三个插件相同的超椭圆，不加任何描边，只铺纸面 + 竖纹 -->
  <g clip-path="url(#s-box)">
    <rect width="48" height="48" fill="url(#s-paper)"/>
    <rect width="48" height="48" fill="url(#s-stripe)"/>
  </g>

  <!-- EchoMusic 字标：位置与字重和另外三个插件完全一致，白色换成锤子的灰阶 -->
  <g transform="matrix(0.046875 0 0 0.046875 0 -2)">
    <text x="512" y="475" font-family="system-ui, -apple-system, sans-serif"
          font-size="180" font-weight="800" fill="#6b6b6b"
          text-anchor="middle" letter-spacing="6">Echo</text>
    <text x="512" y="683" font-family="system-ui, -apple-system, sans-serif"
          font-size="200" font-weight="900" fill="#2c2c2c"
          text-anchor="middle" letter-spacing="10">MUSIC</text>
    <rect x="412" y="750" width="200" height="8" rx="4" fill="url(#s-blue)"/>
  </g>
</svg>
